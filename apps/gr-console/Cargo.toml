[package]
name = "gr-console"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GR gantry engineering console backend (axum): S7 polling, OPC UA task commands, task ledger, measurement history, scenarios"

[dependencies]
s7 = { path = "../../crates/s7" }
plc-layout = { path = "../../crates/plc-layout" }
plc-link = { path = "../../crates/plc-link", features = ["io"] }
gr-proto = { path = "../../crates/gr-proto" }
opcua-cmd = { path = "../../crates/opcua-cmd" }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
calamine = { workspace = true }
rust_xlsxwriter = { workspace = true }
csv = { workspace = true }
rand = "0.9"
# server feature: in-process GRM OPC UA server for --demo-opcua (sim_opcua.rs)
async-opcua = { version = "0.19", default-features = false, features = ["client", "server"] }
include_dir = { version = "0.7", optional = true }
mime_guess = { version = "2", optional = true }

[features]
# 패키지 빌드(tools/package.*)만 켠다 — 웹 빌드와 PLC 계약을 실행 파일에 넣어 파일 하나로 배포한다.
embed = ["dep:include_dir", "dep:mime_guess"]

[lints]
workspace = true
