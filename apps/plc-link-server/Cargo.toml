[package]
name = "plc-link-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PC test server for the PLC socket link: PLC port (FRAME/NDJSON/HTTP), passive PLC clients, control REST/SSE/HTML, PLC simulator and self test"

[lib]
name = "plc_link_server"
path = "src/lib.rs"

[[bin]]
name = "plc-link"
path = "src/main.rs"

[dependencies]
plc-link = { path = "../../crates/plc-link", features = ["io"] }
plc-layout = { path = "../../crates/plc-layout" }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
time = { workspace = true }
futures = { workspace = true }

[lints]
workspace = true
