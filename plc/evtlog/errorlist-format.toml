# How Src / A / B of ErrorList items read in the console (EVTLOG ErrorList rows, docs/evtlog/errorlist-rows.md).
#
# The ErrorList workbook stays the human document (texts, value meanings, conditions); this file only adds what a
# machine needs to print a value: an enum name, a scale, a short English label. Anything not listed here is guessed
# from the ErrorList meaning (`시작 위치 (mm×10)` → 시작 위치 598.4 mm) and shown only when it is not 0.
#
# Tables: [gr] = GR1 / GR2 (one robot sheet), [grm] = GRM — the two ErrorLists reuse numbers with other meanings.
# Keys: an ErrorList code, or a prefix ending in `*` (the exact code wins, then the longest prefix).
# Specs (a / b / src): raw · none · hex · onoff · enum:<catalog enum> · bits:<catalog enum> · div:<n>[ unit] ·
# unit:<unit>. Labels (a_label / b_label / src_label) are English field names.
# ALARM rows have no Src value (Src = area); an Alarm / Warn without an A / B meaning shows B as `step` when not 0.

# ---------------------------------------------------------------- GR1 / GR2

