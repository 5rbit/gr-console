# SYS
[[event]]
code = 101
name = "SYS_STARTUP"
cat = "SYS"
lvl = "INFO"
text = "PLC 기동 {a:bits:startup}"
a = "startup flags"

[[event]]
code = 102
name = "SYS_PROG_ERROR"
cat = "SYS"
lvl = "ERROR"
text = "Programming error : block {src}, Fault_ID {a:hex}, DB {b}"

[[event]]
code = 103
name = "SYS_CYCLE_OVERRUN"
cat = "SYS"
lvl = "ERROR"
text = "Cycle time error : Fault_ID {a:hex}"

[[event]]
code = 104
name = "SYS_CLOCK_SET"
cat = "SYS"
