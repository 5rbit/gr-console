# writes Src 3 with EVT_ALARM_AREA_EVENT -> rename it to _OPERATOR when GRM's constants are regenerated.
[enum.alarm_area]
plc_const = true
values = { 1 = "FAULT", 2 = "WARN", 3 = "OPERATOR", 4 = "INFO" }

