# PLC event log catalog (single source of truth, 2026-09-27).
#
# PLC side : "EvtWrite"(Cat, Lvl, Src, Code, A, B)  (FC; TIA names are case-insensitive, so not "EvtLog" next to DB "EVTLOG") appends one EVT_Entry to DB "EVTLOG" (DB950, standard access).
#            The PLC stores numbers only. Constants EVT_* are generated from this file
#            (`gr-contract gen-evt --plc <PLC>` -> <export>/<PLC>/tags/Const/EVT_Const_Gen.xml).
# PC side  : gr-console reads the ring by Seq and renders `text` at display time. Raw values are kept, so editing a
#            text re-renders stored rows; an unknown (cat, code) renders as "CAT code src=.. a=.. b=..".
#
# Entry (EVT_Entry, 34 B): Seq UDInt | Time DTL | Cat USInt | Lvl USInt | Src UInt | Code UInt | A DInt | B DInt | Ctx UDInt
#   Ctx = current task WorkId (robots: TASK.Now.WorkId, else Buff[0].WorkId, filled once per scan by UL_EvtPre;
#         LGR_Task_Data has no CMD_ID). GRM: 0 unless the event sets it. The console links Ctx to the ledger by WorkId.
#
# Template syntax (text):
#   {src} {a} {b} {code} {ctx}     raw integer
#   {a:enum}                       enum lookup (unknown value -> number)
#   {a:bits:enum}                  names of the set bits (bit n = value n of the enum), joined by ", "
#   {a/100}                        divide, decimals = digits of the divisor (0.01 -> 2)
#   {a:hex}                        16#XXXX
#   {a:onoff}                      0 -> OFF, else ON
#   {alarm}                        ALARM category only: (area = src, bit index = a) -> code + text from the HMI
#                                  alarm list (contract alarms.json)
#
# Enums: `values` inline, or `from_const = "<PREFIX>"` = every constant of the PLC contract whose name starts with the
#        prefix (name shown without the prefix). `plc_const = true` also emits EVT_<ENUM>_<NAME> constants, only for the
#        PLCs in the enum `plc` list when it has one.
#
# Codes are unique across categories: cat * 100 + n. STEP is the exception: its Code is the new step number.
# `plc` = PLCs that emit the event (GR1, GR2, GRM). `lvl` = default level the PLC writes.
# CatMask bit n enables category id n. Levels below Cfg.MinLevel are not written.
#
# ErrorList rows — ErrorList items (Alarm / Warn / Operator / Info, gr-console docs/evtlog/errorlist-rows.md is the spec):
#   Cat  = 6 ALARM (Alarm + Warn) | 18 OPERATOR | 19 INFO
#   Code = Trans * 10000 + ErrorList number   (Trans 1 raise, 2 clear, 3 momentary, 4 suppressed summary;
#          EVT_TRANS_*, EVT_TRANS_MUL). F3119 raised = 13119, W1101 cleared = 21101, I0301 = 30301.
#   Src  = ALARM: 1 FAULT / 2 WARN (EVT_ALARM_AREA_*) · OPERATOR / INFO: the ErrorList "Src = ..." value, else 0
#   A, B = ErrorList value A / B (raise, momentary) · clear: A = flicker count, B = active ms · summary: A = rows
#          suppressed since the last row of this code, B = 0
#   Lvl  = per ErrorList level, the same on every transition: Alarm ERROR, Warn WARN, Operator / Info INFO
#   ErrorList log-only Info items (I51xx..I55xx) are the catalog events below, unchanged; the console reads their type
#   from errorlist.json (`catalog`). An ErrorList ALARM row has Code >= 10000, so bit alarm rows
#   (ALM_RAISED / ALM_CLEARED below) still read.
#   Texts come from plc/contract/<PLC>/errorlist.json (`gr-contract errorlist`), value hints from errorlist-format.toml.

version = 1
const_prefix = "EVT_"
db = "EVTLOG"
db_number = 950
watch_db = "EVTWATCH"
watch_db_number = 951
entry_udt = "EVT_Entry"
capacity = 1000
# default PLC config (EVTLOG.Cfg start values)
min_level = "INFO"
max_per_scan = 32

[[level]]
id = 0
name = "TRACE"
[[level]]
id = 1
name = "DEBUG"
[[level]]
id = 2
name = "INFO"
[[level]]
id = 3
name = "WARN"
[[level]]
id = 4
name = "ERROR"

[[cat]]
id = 1
name = "SYS"
[[cat]]
id = 2
name = "MODE"
[[cat]]
id = 3
name = "STEP"
[[cat]]
id = 4
name = "TASK"
[[cat]]
id = 5
name = "CMD"
[[cat]]
id = 6
name = "ALARM"
[[cat]]
id = 7
name = "GRIP"
[[cat]]
id = 8
name = "DRIVE"
[[cat]]
id = 9
name = "SAFETY"
[[cat]]
id = 10
name = "SENSOR"
[[cat]]
id = 11
name = "MEAS"
[[cat]]
id = 12
name = "ILOCK"
[[cat]]
id = 13
name = "ANTICOL"
[[cat]]
id = 14
name = "COMM"
[[cat]]
id = 15
name = "DATA"
# GRM-only categories
[[cat]]
id = 16
name = "STATION"
[[cat]]
id = 17
name = "SCEN"
# ErrorList rows (ALARM 6 carries Alarm + Warn)
[[cat]]
id = 18
name = "OPERATOR"
[[cat]]
id = 19
name = "INFO"

