[server]
bind = "127.0.0.1:8090"
cors = ""

[paths]
data_dir = "data"
contract_dir = "plc/contract"
sqlite = "data/gr-console.db"

[[plcs]]
name = "GR2"
role = "gr"
contract = "GR2_PLC"
host = "192.168.1.102"
port = 102
rack = 0
slot = 1
fast = ["OPCUA", "TASK"]
webmon = ["WEBMON"]
slow = ["PARA", "ALARM", "Interface_GRM", "CELL", "STATION", "MEASLOG", "LASERDIAG", "GRIP_TUNE"]   # GRIP_TUNE = 그리퍼 학습 곡선(그리퍼 화면, 2026-09-25)
on_demand = ["MEASLOG_HIST"]
# OPCUA.STAT.ComponentID 는 PLC 프로그램이 쓰지 않아 실기에서 항상 0 (2026-09-14) → 검사하지 않음
checks = [
  { db = "PARA", path = "Machine.ID", equals = 2 },
]

[[plcs]]
name = "GRM"
role = "grm"
contract = "GRM_PLC"
host = "192.168.1.10"
port = 102
rack = 0
slot = 1
fast = ["OPCUA"]
webmon = []
slow = ["STATION", "CELL", "MACHINE"]
on_demand = []
checks = []   # GR[n].STAT.ComponentID 는 실기에서 0 — DB 크기 검사만

[opcua]
endpoint = "opc.tcp://192.168.1.10:4840"
security_policy = "None"
security_mode = "None"
user = ""
ns_hint = 3
db_name = "OPCUA"
root_path = "GR[2].CMD"

[poll]
fast_ms = 200
webmon_ms = 500
slow_ms = 5000
grm_fast_ms = 500

# PLC 소켓 링크 수신 — PLC 슬롯(SOCK_CFG.Conn[n])을 Active 로 두면 여기로 붙는다.
# 트레이스(사이클 단위 시계열, /api/trace)는 이 링크로만 동작한다. 포트가 이미 쓰이면 경고만 남기고 콘솔은 그대로 뜬다.
[link]
enabled = true
bind = "0.0.0.0:2000"

# 컨베이어 화물 코드 트래킹 — GRM ConnectionPrev/Next 밖의 추가 연결 [from, to] (스테이션 Id).
# 품목 코드만 넘기고 PLC 에는 쓰지 않는다(GRM 측정·OD 트래킹은 그대로). 테스트 베드: 2003(CV 2103) → 2102.
# PLC 이벤트 로그 — EVTLOG(DB950) 수집 + 콘솔 이벤트 → data/events.db (이벤트 탭, /api/events).
# 계약에 EVTLOG 가 있는 PLC 는 설정 없이도 머리(36 B)만 빠른 주기에 읽고, 본문은 Total 이 늘 때만 읽는다.
# PLC 에 아직 EVTLOG 가 없으면 그 DB 만 건너뛴다(레이아웃 판정은 그대로). 사전: plc/evtlog/catalog.toml
[evtlog]
enabled = true
keep_days = 90     # 이보다 오래된 행은 매시간 지운다
max_mb = 20480     # events.db 크기 상한 — 넘으면 오래된 것부터
daily_report = false  # true: 자정이 지나면 전날 보고서 data/reports/events-YYYY-MM-DD.xlsx (keep_days 로 정리)

[conveyor]
# extra_links = [[2003, 2102]]

[cmd]
protocol = 1
src = 5000
dst = 4002
echo_timeout_ms = 5000
status_plc = "GR2"
grm_plc = "GRM"

# 로봇 목록 — GRM 뒤에 최대 2대. 비워 두면 [cmd]/[opcua] 의 한 대(GR2) 만 쓴다.
# 두 대를 쓰려면 아래 주석을 풀고 GR1 의 S7 PLC 도 [[plcs]] 에 추가한다(contract "GR1_PLC", checks Machine.ID 1). GR1 실기 프로그램이 GR1_PLC 계약과 같아야 레이아웃 검사를 통과한다.
# [[robots]]
# id = 1
# name = "GR1"
# plc = "GR1"
# opcua_root = "GR[1].CMD"
# dst = 4001
#
# [[robots]]
# id = 2
# name = "GR2"
# plc = "GR2"
# opcua_root = "GR[2].CMD"
# dst = 4002

