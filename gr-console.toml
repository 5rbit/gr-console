[server]
bind = "127.0.0.1:8090"
cors = ""

[paths]
data_dir = "data"
contract_dir = "plc/contract"
sqlite = "data/gr-console.db"

[[plcs]]
name = "GR2"
role = "gr"
contract = "GR2_PLC"
host = "192.168.1.102"
port = 102
rack = 0
slot = 1
fast = ["OPCUA", "TASK"]
webmon = ["WEBMON"]
slow = ["PARA", "ALARM", "Interface_GRM", "CELL", "STATION", "MEASLOG", "LASERDIAG"]
on_demand = ["MEASLOG_HIST"]
checks = [
  { db = "OPCUA", path = "STAT.ComponentID", equals = 4002 },
  { db = "PARA", path = "Machine.ID", equals = 2 },
]

[[plcs]]
name = "GRM"
role = "grm"
contract = "GRM_PLC"
host = "192.168.1.10"
port = 102
rack = 0
slot = 1
fast = ["OPCUA"]
webmon = []
slow = ["STATION", "CELL", "MACHINE"]
on_demand = []
checks = [{ db = "OPCUA", path = "GR[2].STAT.ComponentID", equals = 4002 }]

[opcua]
endpoint = "opc.tcp://192.168.1.10:4840"
security_policy = "None"
security_mode = "None"
user = ""
ns_hint = 3
db_name = "OPCUA"
root_path = "GR[2].CMD"

[poll]
fast_ms = 200
webmon_ms = 500
slow_ms = 5000
grm_fast_ms = 500

[cmd]
protocol = 1
src = 5000
dst = 4002
echo_timeout_ms = 5000
status_plc = "GR2"
grm_plc = "GRM"

# 로봇 목록 — GRM 뒤에 최대 2대. 비워 두면 [cmd]/[opcua] 의 한 대(GR2) 만 쓴다.
# 두 대를 쓰려면 아래 주석을 풀고 GR1 의 S7 PLC 도 [[plcs]] 에 추가한다(contract "GR1_PLC", checks ComponentID 4001). GR1 도 GR2 V1.4.1 과 같은 프로그램이라 WEBMON·MEASLOG·STATION 을 똑같이 읽는다.
# [[robots]]
# id = 1
# name = "GR1"
# plc = "GR1"
# opcua_root = "GR[1].CMD"
# dst = 4001
#
# [[robots]]
# id = 2
# name = "GR2"
# plc = "GR2"
# opcua_root = "GR[2].CMD"
# dst = 4002

# GR1 상태 PLC 예시 (두 대 구성일 때 [[robots]] 와 함께 주석 해제; contract 는 plc/contract/GR1_PLC 에 동기화돼 있음)
