# gr-console 설정 — 이 파일은 실행 파일(gr-console.exe / gr-console) **옆**에 둔다.
# 실행 파일은 이 파일이 있는 폴더를 기준으로 data/ 를 만든다. 값을 바꾸면 다시 시작한다.
#
# 처음 켤 때 할 일은 셋뿐이다:
#   1. [[plcs]] 의 host — GR2(로봇 상태 PLC) · GRM(GCS 명령 PLC) 의 IP
#   2. [opcua] endpoint — GRM 의 OPC UA 주소
#   3. 장비 없이 화면만 보려면: 실행 파일을 `--demo` 로 켠다(데모 실행 파일 참고)

[server]
bind = "127.0.0.1:8090"     # 다른 PC에서도 열려면 "0.0.0.0:8090" (방화벽 8090/TCP 허용)
cors = ""
open_browser = true         # 켜지면 기본 브라우저로 http://127.0.0.1:8090/ 을 연다

[paths]
data_dir = "data"           # 원장(SQLite) · OPC UA 노드 캐시 · 인증서. 백업은 이 폴더 하나.
contract_dir = "plc/contract"  # 없으면 실행 파일에 내장된 계약을 data/contract/ 에 풀어 쓴다
sqlite = "data/gr-console.db"

[[plcs]]
name = "GR2"
role = "gr"
contract = "GR2_PLC"
host = "192.168.1.102"
port = 102
rack = 0
slot = 1
fast = ["OPCUA"]
webmon = ["WEBMON"]
slow = ["PARA", "CELL", "STATION", "MEASLOG", "LASERDIAG"]
on_demand = ["MEASLOG_HIST", "TASK", "ALARM", "Interface_GRM"]
# OPCUA.STAT.ComponentID 는 PLC 프로그램이 쓰지 않아 실기에서 항상 0 (2026-09-14 실기 확인) → 검사하지 않음
checks = [
  { db = "PARA", path = "Machine.ID", equals = 2 },
]

[[plcs]]
name = "GRM"
role = "grm"
contract = "GRM_PLC"
host = "192.168.1.10"
port = 102
rack = 0
slot = 1
fast = ["OPCUA"]
webmon = []
slow = ["STATION", "CELL"]
on_demand = ["MACHINE"]
checks = []   # GR[n].STAT.ComponentID 는 실기에서 0 — DB 크기 검사만

[opcua]
endpoint = "opc.tcp://192.168.1.10:4840"
security_policy = "None"
security_mode = "None"
user = ""
ns_hint = 3
db_name = "OPCUA"
root_path = "GR[2].CMD"
# TaskData 를 리프 51 개 대신 구조체 노드 하나로 쓴다(세션마다 읽기로 배치를 검증한 뒤에만, 거절되면 리프로 복귀).
# 실기 쓰기 확인 전이라 기본 false — 검증 결과는 사이드바 OPC UA 행 툴팁 "구조체 검증됨" 으로 보인다.
# struct_write = true

[poll]
fast_ms = 100
webmon_ms = 500
slow_ms = 5000
grm_fast_ms = 500

# PLC 소켓 링크 수신 — PLC 슬롯(SOCK_CFG.Conn[n])을 Active 로 두면 여기로 붙는다.
# 트레이스(사이클 단위 시계열, /api/trace)는 이 링크로만 동작한다. 포트가 이미 쓰이면 경고만 남기고 콘솔은 그대로 뜬다.
[link]
enabled = true
bind = "0.0.0.0:2000"

# 컨베이어 화물 코드 트래킹 — GRM ConnectionPrev/Next 밖의 추가 연결 [from, to] (스테이션 Id).
# 품목 코드만 넘기고 PLC 에는 쓰지 않는다(GRM 측정·OD 트래킹은 그대로). 테스트 베드: 2003(CV 2103) → 2102.
[conveyor]
# extra_links = [[2003, 2102]]

[cmd]
protocol = 1
src = 5000
dst = 4002
echo_timeout_ms = 5000
status_plc = "GR2"
grm_plc = "GRM"

# 로봇 목록 — GRM 뒤에 최대 2대. 비워 두면 [cmd]/[opcua] 의 한 대(GR2) 만 쓴다.
# 두 대를 쓰려면 아래 [[robots]] 두 블록과 맨 아래 GR1 [[plcs]] 블록의 주석을 함께 푼다.
# [[robots]]
# id = 1
# name = "GR1"
# plc = "GR1"
# opcua_root = "GR[1].CMD"
# dst = 4001
#
# [[robots]]
# id = 2
# name = "GR2"
# plc = "GR2"
# opcua_root = "GR[2].CMD"
# dst = 4002

# GR1 상태 PLC (두 대 구성일 때 [[robots]] 와 함께 주석 해제; 계약 GR1_PLC 도 실행 파일에 들어 있다)
# 주의: GR1 실기 PLC 프로그램이 GR1_PLC 계약과 같아야 한다 — DB 크기·LayoutSig 가 다르면 레이아웃 검사가
#       실패해 GR1 작업 제출이 막힌다(연결 전에 TIA 프로그램 버전을 맞출 것).
# [[plcs]]
# name = "GR1"
# role = "gr"
# contract = "GR1_PLC"
# host = "192.168.1.101"
# port = 102
# rack = 0
# slot = 1
# fast = ["OPCUA"]
# webmon = ["WEBMON"]
# # LASERDIAG 는 GR1 계약에 .xml(DB 번호)이 없어 제외
# slow = ["PARA", "CELL", "STATION", "MEASLOG"]
# on_demand = ["MEASLOG_HIST", "TASK", "ALARM", "Interface_GRM"]
# # OPCUA.STAT.ComponentID 는 실기에서 0 → Machine.ID 만
# checks = [{ db = "PARA", path = "Machine.ID", equals = 1 }]
